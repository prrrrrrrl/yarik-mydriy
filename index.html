<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Александр Невский — интеллект-карта</title>
<style>
:root{--bg:#f4f5f7;--dot:#cfd2d8;--line:#8a8f99;--node:#9aa5f2;--bd:#f08ad8;--ink:#1a1a2e;--ui:#fff;--uink:#222;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181c;--dot:#2c2e35;--line:#7a7f8a;--ui:#2a2b31;--uink:#eee}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#vp{position:absolute;inset:0;touch-action:none;cursor:grab;background-image:radial-gradient(var(--dot) 1.5px,transparent 1.5px);background-size:24px 24px}
#st{position:absolute;left:0;top:0;width:2400px;height:1800px;transform-origin:0 0}
svg{position:absolute;left:0;top:0;pointer-events:none}
.n{position:absolute;background:var(--node);border:3px solid var(--bd);border-radius:26px;color:var(--ink);padding:12px 16px;font-size:15px;line-height:1.3;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.n.c{font-weight:700;font-size:18px;padding:16px 20px}
.n.k{font-weight:700;font-size:17px;border-radius:30px}
.im{width:100%;min-height:70px;border:2px dashed rgba(26,26,46,.45);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:11px;font-weight:400;cursor:pointer;overflow:hidden;padding:4px}
.im.big{min-height:130px}
.im span{font-size:26px}
.im img{width:100%;max-height:180px;object-fit:cover;border-radius:10px;display:block}
#ui{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;z-index:5}
#ui button{width:42px;height:42px;border:0;border-radius:12px;background:var(--ui);color:var(--uink);font-size:20px;box-shadow:0 1px 6px rgba(0,0,0,.25)}
#ui small{background:var(--ui);color:var(--uink);padding:6px 10px;border-radius:10px;font-size:12px;box-shadow:0 1px 6px rgba(0,0,0,.25)}
#tt{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));background:var(--ui);color:var(--uink);padding:8px 14px;border-radius:12px;font-weight:600;box-shadow:0 1px 6px rgba(0,0,0,.25);z-index:5}
</style>
</head>
<body>
<div id="tt">Интеллект-карта</div>
<div id="vp"><div id="st"><svg id="sv" width="2400" height="1800"></svg></div></div>
<div id="ui"><button id="zo">−</button><small id="zl">100%</small><button id="zi">+</button><button id="fit" title="Показать всё">⤢</button><small>Нажмите на пунктирную рамку, чтобы добавить картинку</small></div>
<script>
var CX=1200,CY=650,st=document.getElementById('st'),sv=document.getElementById('sv');
var NS='http://www.w3.org/2000/svg';
function mk(o){
  var d=document.createElement('div');d.className='n'+(o.cls?' '+o.cls:'');
  d.style.width=o.w+'px';
  if(o.img){
    var l=document.createElement('label');l.className='im'+(o.big?' big':'');
    l.innerHTML='<span>'+(o.ic||'🖼️')+'</span>'+(o.cap||'Добавить изображение');
    var i=document.createElement('input');i.type='file';i.accept='image/*';i.hidden=true;
    i.onchange=function(){var f=i.files[0];if(!f)return;var r=new FileReader();r.onload=function(){l.innerHTML='';var m=document.createElement('img');m.src=r.result;m.alt='';l.appendChild(m);l.appendChild(i);};r.readAsDataURL(f);};
    l.appendChild(i);d.appendChild(l);
    if(o.src){var def=l.innerHTML,m=new Image();m.alt='';m.onload=function(){l.innerHTML='';l.appendChild(m);l.appendChild(i);};m.src='https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(o.src.replace(/ /g,'_'))+'?width=500';}
  }
  var t=document.createElement('div');t.textContent=o.t;d.appendChild(t);
  st.appendChild(d);return d;
}
function atC(el,x,y){el.style.left=x+'px';el.style.top=y+'px';el.style.transform='translate(-50%,-50%)';el._x=x;el._y=y;}
function atT(el,x,y){el.style.left=x+'px';el.style.top=y+'px';el.style.transform='translate(-50%,0)';el._x=x;el._y=y;}
function line(d){var p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke','var(--line)');p.setAttribute('stroke-width','2.5');sv.appendChild(p);}
function elbow(a,b){ // a parent, b child, horizontal elbow
  var s=b._x>a._x?1:-1,x1=a._x+s*a.offsetWidth/2,x2=b._x-s*b.offsetWidth/2,xm=(x1+x2)/2;
  line('M'+x1+' '+a._y+'H'+xm+'V'+b._y+'H'+x2);
}
var R=[{t:'Внутренняя политика',ic:'🏰',kids:[
 {t:'🏛️ Новгород',kids:[
  {t:'С 1236 г. княжил в Новгороде; конфликтовал с боярами и вечем, в 1240 г. уехал, а в 1241 г. был вызван обратно',img:1,ic:'🏛️',cap:'Новгород',src:'Cathedral of St. Sophia, Novgorod, Russia.jpg'},
  {t:'Во время смуты 1255–1257 гг. сместил сына Василия с новгородского стола'}]},
 {t:'👑 Великое княжение',kids:[
  {t:'С 1252 г. великий князь владимирский (ярлык от хана)',img:1,ic:'👑',cap:'Владимир',src:'Vladimir assumption.jpg'},
  {t:'Восстанавливал земли, разорённые Батыем, и укреплял княжескую власть'}]},
 {t:'📜 Дань и порядок',kids:[
  {t:'В 1257–1259 гг. при переписи подавил сопротивление новгородцев, чтобы избежать нового карательного похода'},
  {t:'Выплата дани Орде как цена сохранения княжества'}]}]}];
var L=[{t:'Внешняя политика',ic:'🌍',kids:[
 {t:'🛡️ Запад',kids:[
  {t:'1240 г. — Невская битва: победа над шведами, отсюда прозвище «Невский»',img:1,ic:'🇸🇪',cap:'Невская битва',src:'Alexander Nevsky in the battle with the Swedes by Boris Chorikov.jpg'},
  {t:'1242 г. — Ледовое побоище: разгром Ливонского ордена на Чудском озере',img:1,ic:'🧊',cap:'Ледовое побоище',src:'Facial Chronicle - b.06, page 085 - Battle of the Ice.jpg'}]},
 {t:'🐎 Золотая Орда',kids:[
  {t:'1247–1249 гг. — поездки к Батыю и в Каракорум'},
  {t:'Признал верховенство хана, получил ярлык и избегал открытого конфликта'}]},
 {t:'🌲 Соседи',kids:[
  {t:'1245 г. — победы над литовцами под Торопцом и Усвятом'},
  {t:'1251 г. — договор с Норвегией; 1256 г. — поход в Финляндию'}]}]}];
var STEP=150;
function side(tree,dir){
  var leaves=0,tot=0;
  (function cnt(n){if(!n.kids)tot++;else n.kids.forEach(cnt);})(tree[0]);
  var y0=CY-(tot-1)*STEP/2,i=0;
  function place(n,d){
    var cls=d==0?'k':(d==1?'k':''),w=[170,190,270][d];
    var el=mk({t:n.t,w:w,img:n.img,ic:n.ic,cap:n.cap,src:n.src,cls:d<2?'k':''});
    var ys=[];
    if(n.kids){n.kids.forEach(function(k){ys.push(place(k,d+1));});}
    var y=n.kids?(ys[0]._y+ys[ys.length-1]._y)/2:(y0+(i++)*STEP);
    if(d==0)y=CY;
    atC(el,CX+dir*[300,600,950][d],y);
    el._kids=ys;n._el=el;return el;
  }
  var root=place(tree[0],0);
  (function link(e){e._kids.forEach(function(k){elbow(e,k);link(k);});})(root);
  return root;
}
var cen=mk({t:'⚔️ Александр Невский (ок. 1221–1263)',w:230,img:1,big:1,ic:'🛡️',cap:'Добавить портрет',src:'Alexandr nevskiy parsuna.jpg',cls:'c'});
atC(cen,CX,CY);
var r=side(R,1),l=side(L,-1);
elbow(cen,r);elbow(cen,l);
// bottom
var pl=mk({t:'❤️ Личная жизнь',w:190,cls:'k'});atC(pl,CX,CY+390);
line('M'+CX+' '+(CY+cen.offsetHeight/2)+'V'+(CY+390-pl.offsetHeight/2));
var fam=mk({t:'👨‍👩‍👧‍👦 Семья',w:170,cls:'k'});atC(fam,CX-330,CY+390);
var ch=mk({t:'🧭 Характер',w:170,cls:'k'});atC(ch,CX+330,CY+390);
elbow(pl,fam);elbow(pl,ch);
function stack(parent,items,x){
  var y=parent._y+parent.offsetHeight/2+50,prev=parent;
  items.forEach(function(o){
    var e=mk({t:o.t,w:270,img:o.img,ic:o.ic,cap:o.cap,src:o.src});atT(e,x,y);
    var py=prev===parent?parent._y+parent.offsetHeight/2:prev._y+prev.offsetHeight;
    line('M'+x+' '+py+'V'+y);
    prev=e;y+=e.offsetHeight+45;
  });
}
stack(pl,[
 {t:'Родился ок. 1221 г. в Переславле-Залесском; сын князя Ярослава Всеволодовича, внук Всеволода Большое Гнездо',img:1,ic:'👶',cap:'Происхождение',src:'Alexander Nevsky, Russian School 19th-20th century.jpg'},
 {t:'С 1236 г., в 15 лет, стал князем в Новгороде и быстро проявил себя как полководец'},
 {t:'⚰️ Умер 14 ноября 1263 г. в Городце на обратном пути из Орды; погребён во Владимире'}],CX);
stack(fam,[
 {t:'💍 Жена — Александра Брячиславна, дочь полоцкого князя (брак 1239 г.)'},
 {t:'👦 Дети: Василий, Дмитрий, Андрей, Даниил и дочь Евдокия'},
 {t:'🏙️ Даниил стал родоначальником московских князей'}],CX-330);
stack(ch,[
 {t:'⚔️ Храбрый воин и талантливый полководец'},
 {t:'🧠 Осторожный и расчётливый политик-дипломат'},
 {t:'⛪ Глубоко религиозный человек; в 1547 г. канонизирован церковью'}],CX+330);
// pan/zoom
var vp=document.getElementById('vp'),s=1,tx=0,ty=0;
function ap(){st.style.transform='translate('+tx+'px,'+ty+'px) scale('+s+')';document.getElementById('zl').textContent=Math.round(s*100)+'%';}
function zoom(f,cx,cy){var ns=Math.min(2,Math.max(.2,s*f));tx=cx-(cx-tx)*ns/s;ty=cy-(cy-ty)*ns/s;s=ns;ap();}
function fit(){s=Math.min(innerWidth/2300,innerHeight/1750);tx=(innerWidth-2400*s)/2;ty=(innerHeight-1800*s)/2;if(s<.2)s=.2;ap();}
var drag=null;
vp.addEventListener('pointerdown',function(e){if(e.target.closest('.im'))return;drag={x:e.clientX-tx,y:e.clientY-ty};vp.setPointerCapture(e.pointerId);vp.style.cursor='grabbing';});
vp.addEventListener('pointermove',function(e){if(!drag)return;tx=e.clientX-drag.x;ty=e.clientY-drag.y;ap();});
vp.addEventListener('pointerup',function(){drag=null;vp.style.cursor='grab';});
vp.addEventListener('wheel',function(e){e.preventDefault();zoom(e.deltaY<0?1.1:.9,e.clientX,e.clientY);},{passive:false});
document.getElementById('zi').onclick=function(){zoom(1.25,innerWidth/2,innerHeight/2);};
document.getElementById('zo').onclick=function(){zoom(.8,innerWidth/2,innerHeight/2);};
document.getElementById('fit').onclick=fit;
addEventListener('resize',fit);fit();
</script>
</body>
</html>
